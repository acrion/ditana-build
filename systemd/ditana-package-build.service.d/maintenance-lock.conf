# The build must not overlap with the automatic system update this host runs,
# so it takes a lock the two share. Everything about that arrangement is in
# this file, and the unit beside it works without it: on a host that does not
# update itself while a build could be running, delete this drop-in and nothing
# else changes.
#
# The empty assignment first is how systemd is told to replace a command rather
# than add a second one. What follows has to repeat the flags of the unit,
# because a drop-in cannot wrap an existing ExecStart - the two are kept
# identical by ditana-package-build-test rather than by hope.
#
# --wait blocks on the lock itself via flock -w rather than polling, so a
# collision costs at most half an hour instead of a whole day. Beyond that the
# job steps aside and the next day's tick tries again.
#
# '+' runs this with full privileges, as the unit it replaces does: the pipeline
# drops to the build user by itself.

[Unit]
Documentation=https://github.com/acrion/ditana-build/blob/main/docs/build-host.md

[Service]
ExecStart=
ExecStart=+/usr/bin/maintenance-lock run package-build --wait 1800 -- \
          /usr/local/bin/ditana-package-build --release-after-test

# The lock directory is not declared here. It belongs to a group so that more
# than one job can take the lock, and it is created with that group at boot. A
# RuntimeDirectory= in this unit, which runs as root, gave the directory back to
# root with mode 0755 at every start and locked out every job that is not root.
